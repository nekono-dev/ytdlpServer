version: "3"

services:
  redis:
    image: redis
    restart: always
  pot-provider:
    image: brainicism/bgutil-ytdlp-pot-provider
    restart: always
  cloudflare:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run --token <YOUR_CLOUDFLARE_TUNNEL_TOKEN>
    depends_on:
    - api
  api:
    build: ./apiServer
    depends_on:
      - redis
      - pot-provider
    environment:
      REDIS_URL: redis://redis
      SERVER_TTL: 24
    restart: always
    ports:
      - 5000:5000
  worker:
    build: ./workerServer
    depends_on:
      - redis
      - pot-provider
    environment:
      REDIS_URL: redis://redis
      REDIS_TTL: 604800
      RETRY_COUNT: 5
      DOWNLOAD_DIR: /download
    volumes:
      - /mnt:/download
    restart: always
  redis-insight:
    image: redislabs/redisinsight:latest
    environment:
      RI_REDIS_HOST: redis
    ports:
      - 5540:5540
    depends_on:
      - redis
    restart: always
