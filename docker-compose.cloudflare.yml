version: "3"

services:
  redis:
    image: redis
    restart: always
  pot-provider:
    image: brainicism/bgutil-ytdlp-pot-provider
    restart: always
  cloudflare:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run --token <YOUR_CLOUDFLARE_TUNNEL_TOKEN>
    depends_on:
    - api
  docker-proxy:
    image: tecnativa/docker-socket-proxy
    environment:
      # dispatcher に許可する Docker API: コンテナの作成・起動・停止・一覧・inspect
      # (CONTAINERS)、それらの実行 (POST)、終了の検知 (EVENTS) のみ。イメージ・
      # exec・ボリューム・ネットワーク操作は許可しない (既定で拒否)。
      CONTAINERS: 1
      POST: 1
      EVENTS: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: always
  api:
    build:
      context: .
      dockerfile: apiServer/Dockerfile
    depends_on:
      - redis
      - pot-provider
    environment:
      REDIS_URL: redis://redis
      BROWSER_UI_URL: ${BROWSER_UI_URL:-}
    volumes:
      - ./cookies:/cookies
      - ytdlp-bin:/opt/ytdlp:ro
    restart: always
    ports:
      - 5000:5000
  # dispatcher: ジョブがあるときだけ worker コンテナを起動する常駐サービス。
  dispatcher:
    build:
      context: .
      dockerfile: workerServer/Dockerfile
    depends_on:
      - redis
      - pot-provider
      - docker-proxy
    environment:
      REDIS_URL: redis://redis
      REDIS_TTL: 604800
      RETRY_COUNT: 5
      BROWSER_UI_URL: ${BROWSER_UI_URL:-}
      DOWNLOAD_DIR: /download
      DISPATCH_MODE: docker
      DOCKER_HOST: tcp://docker-proxy:2375
      WORKER_MAX: ${WORKER_MAX:-1}
    volumes:
      - /mnt:/download
      - ./cookies:/cookies
      - ytdlp-bin:/opt/ytdlp
    restart: always
  browser:
    build: ./browserServer
    environment:
      SESSION_TIMEOUT: ${SESSION_TIMEOUT:-900}
      # ブラウザのタイムゾーン・言語は、サーバの外向き IP の所在地に合わせる
      # (食い違うと、X などでログインが制限される)
      TZ: ${TZ:-Asia/Tokyo}
      BROWSER_LANG: ${BROWSER_LANG:-ja,en-US,en}
    volumes:
      - ./cookies:/cookies
    shm_size: 512m
    init: true
    ports:
      - 8080:8080
    restart: always
  redis-insight:
    image: redislabs/redisinsight:latest
    environment:
      RI_REDIS_HOST: redis
    ports:
      - 5540:5540
    depends_on:
      - redis
    restart: always

volumes:
  ytdlp-bin:
