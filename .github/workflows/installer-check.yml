# 責務: インストーラの頒布（release-installer.yml）の前に通す、このプロジェクト固有の検査。失敗すると install.sh は生成・頒布されない。
#   - 起動ラッパー（installer/run/*.sh）の構文・shellcheck、インストーラの静的検査（node --test）
name: installer-check

on:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 起動ラッパーの検査（構文・shellcheck）
        run: |
          for f in installer/run/*.sh installer/build-redisinsight.sh; do sh -n "$f"; done
          shellcheck -S warning installer/run/*.sh installer/build-redisinsight.sh

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: インストーラの静的検査
        run: node --test tests/installer/*.test.mjs
