# 責務: 仕様書の lint と、単体テスト・仕様との対応・E2E の実行。ブランチ・タグへの push と、プルリクエストごとに動く。
#   - spec-lint: 仕様書の整形（Prettier）と規則（構造・体裁・表現・図）。検査コマンドは GitHub Packages の @nekono-dev/spec-lint
#   - test: Python の単体テスト、受け入れ条件との対応、操作ページの E2E
name: ci

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spec-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: "@nekono-dev"

      - name: 仕様書の lint
        run: npx --yes @nekono-dev/spec-lint@1
        env:
          NODE_AUTH_TOKEN: ${{ secrets.SPEC_LINT_TOKEN }} # read:packages 権限のトークン

  test:
    # Playwright のブラウザ導入が対応する OS に固定する（ubuntu-latest が 26.04 になり、導入できなくなったため）
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            apiServer/requirements.txt
            workerServer/requirements.txt
            browserServer/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: pip install -r apiServer/requirements.txt -r workerServer/requirements.txt -r browserServer/requirements.txt

      - run: npm ci

      - name: Playwright のブラウザを導入（受け入れ条件との対応テストが実ブラウザを使うため、npm test より前に行う）
        run: npx playwright install --with-deps chromium

      - name: Python の単体テスト
        run: python3 -m unittest discover -s tests

      - name: 受け入れ条件との対応とインストーラの静的検査
        run: npm test

      - name: 操作ページの E2E
        run: npm run test:e2e
